# Reference template — production values live in gitops-config (private).
# Replace YOUR_DOMAIN / placeholders before use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: nekazari
  labels:
    app: notifications-api
    component: backend
    module: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
        component: backend
        module: notifications
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_ORG/nkz-module-notifications/notifications-api:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: API_PREFIX
              value: "/api/notifications"
            - name: ORION_LD_URL
              value: "http://orion-ld-service:1026"
            - name: CONTEXT_URL
              value: "http://api-gateway-service:5000/ngsi-ld-context.json"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: INTERNAL_SERVICE_SECRET
            - name: DIGEST_INTERVAL_HOURS
              value: "12"
            - name: IMMEDIATE_MIN_SEVERITY
              value: "high"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-api-service
  namespace: nekazari
  labels:
    app: notifications-api
    module: notifications
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: notifications-api
    component: backend
